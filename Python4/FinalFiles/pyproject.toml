[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[project]
name = "meridian-workbench"
version = "0.3.0"
description = "Meridian Case Intake Workbench: which cases need attention, with evidence."
requires-python = ">=3.11"
dependencies = ["python-dotenv==1.0.1", "anthropic==1.15.0"]
 
[project.optional-dependencies]
dev = ["ruff==0.6.9", "mypy==1.11.2", "pytest==8.3.3"]
 
[tool.setuptools.packages.find]
where = ["src"]
 
[tool.ruff]
line-length = 100
src = ["src", "tests"]
 
[tool.ruff.lint]
select = ["E", "F", "I"]
 
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
 
[tool.pytest.ini_options]
testpaths = ["tests"]
