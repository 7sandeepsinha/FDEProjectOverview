[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[project]
name = "meridian-workbench"
version = "0.1.0"
description = "Meridian Case Intake Workbench: which cases need attention, with evidence."
requires-python = ">=3.11"
dependencies = ["python-dotenv==1.0.1"]
 
[project.optional-dependencies]
dev = ["ruff==0.6.9"]
 
[tool.setuptools.packages.find]
where = ["src"]
 
[tool.ruff]
line-length = 100
src = ["src", "tests"]
 
[tool.ruff.lint]
select = ["E", "F", "I"]
