<script>

  transfers: { pk: 'transfer_id', cols: ['transfer_id', 'from_account', 'to_account', 'amount', 'created_at'], auto: true },
  seats: { pk: 'seat_id', cols: ['seat_id', 'status', 'booked_by', 'version'] },
  bookings: { pk: 'booking_id', cols: ['booking_id', 'seat_id', 'customer', 'booked_at'], auto: true }

/* ---------- script splitter (with ranges, for "run current statement") ---------- */
function splitSqlRanges(text) {

}

const PLAYERS = [];
function makePlayer(host, cfg) {
  const P = { mode: cfg.modes ? cfg.modes[0].id : null, ctx: null, frames: [], i: 0, busy: false };

  const sqlEl = h('div', { class: 'sqlpane' });

    modeBar,
    h('div', { class: 'anim-grid' }, stage, h('div', { class: 'side' }, h('div', { class: 'side-h' }, 'SQL that just ran'), sqlEl, capEl, askEl, ctrlEl))));
  const vis = cfg.build(stage);
  function renderSql() {
    sqlEl.innerHTML = '';
    const last = (P.ctx && P.ctx.last) || [];
    if (!last.length) { sqlEl.append(h('div', { class: 'sq-empty' }, 'Press the button to run the next step. The statements and their results show up here.')); return; }
    for (const r of last) {
      const blk = h('div', { class: 'sq sq-' + r.sid }, h('span', { class: 'who who-' + r.sid }, r.sid), h('pre', { class: 'sq-code', html: highlight(r.sql) }));
      if (!r.res) blk.append(h('div', { class: 'sq-res wait' }, '⏳ waiting for a lock…'));
      else if (r.res.error) blk.append(h('div', { class: 'sq-res err' }, '✖ ' + r.res.error.code + ': ' + r.res.error.msg));
      else if (r.res.kind === 'select') blk.append(gridEl(r.res));
      else blk.append(h('div', { class: 'sq-res ok' }, '✔ ' + (r.res.msg || 'OK')));
      sqlEl.append(blk);
    }
  }
  function render() { if (P.ctx) cfg.render(P.ctx, vis); }
  function setCap(html) { capEl.innerHTML = html || ''; capEl.classList.toggle('on', !!html); }
  function updateCtrl() {
    ctrlEl.innerHTML = ''; askEl.textContent = '';
    const f = P.frames[P.i];
    if (!f) { ctrlEl.append(h('span', { class: 'end' }, 'End of this run.')); }
    else if (f.choices) {
      askEl.innerHTML = '<b>Ask first:</b> ' + esc(f.ask || '');

  'READ COMMITTED': { short: 'RC', tag: 'Reads only what has been published',

    let t = '<h4>Scoreboard</h4><table class="cmpt score"><thead><tr><th class="q">Scenario</th>' + LEVELS.map((L) => '<th class="lv">' + LEVEL_INFO[L].short + '<small>' + L.toLowerCase() + '</small></th>').join('') + '</tr></thead><tbody>';
    Object.keys(SCEN).forEach((k) => { t += '<tr><td class="q"><b>' + SCEN[k].label + '</b></td>' + LEVELS.map((L) => { const v = data[k][L]; return '<td class="v ' + v.s + '">' + ic[v.s] + ' ' + esc(v.t) + '</td>'; }).join('') + '</tr>'; });
    board.innerHTML = t + '</tbody></table><p class="muted fine">✅ safe · ❌ anomaly · ⚠️ safe, but at the cost of a deadlock or a wait the application must handle.</p>';
  }
  async function runAll() {
    if (S.playing) S.playing = false;
    board.innerHTML = '<h4>Scoreboard</h4><p class="muted">Running 5 scenarios × 4 levels…</p>'; const data = {};
    for (const k of Object.keys(SCEN)) {
      const R = makeRunner(SCEN[k], null);
      while (await R.next()) { /* run every step */ }
      data[k] = await R.finish(); R.dispose();
    }
    drawBoard(data);
  }
  function drawAll() { drawPills(); story.textContent = SCEN[S.key].story; drawCtl(); drawTable(); if (!board.innerHTML) drawBoard(null); }
  resetRun();
}
function buildIsolation(host) {
  subTabs(host, [{ id: 'ex', label: 'Explore each level', build: buildExplorer }, { id: 'race', label: 'Race the four levels', build: buildRace }]);
}

(function () {
  let zoom = 1;
  const applyZoom = () => { document.documentElement.style.fontSize = (16 * zoom) + 'px'; };
  $('#zoomIn').addEventListener('click', () => { zoom = Math.min(1.5, +(zoom + 0.1).toFixed(2)); applyZoom(); });
  $('#zoomOut').addEventListener('click', () => { zoom = Math.max(0.8, +(zoom - 0.1).toFixed(2)); applyZoom(); });
  $('#themeBtn').addEventListener('click', () => {
    const r = document.documentElement; const cur = r.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    r.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });
  const tabs = $$('.tab-btn'); const sections = { lab: $('#tab-lab'), anim: $('#tab-anim'), iso: $('#tab-iso') }; const built = {};
  const builders = { lab: () => buildLab(sections.lab), anim: () => buildAnimations(sections.anim), iso: () => buildIsolation(sections.iso) };
  function show(id) {
    tabs.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
    Object.keys(sections).forEach((k) => { sections[k].hidden = k !== id; });
    if (!built[id]) { built[id] = true; builders[id](); }
  }
  tabs.forEach((b) => b.addEventListener('click', () => show(b.dataset.tab)));
  show('lab');
})();
